syntax = "proto3";

package securawr;

option go_package = "github.com/Okenamay/securawr/gen/proto";

// Определение сервиса SecuRawr
service SecuRawrService {
  // Ping для проверки соединения
  rpc Ping(PingRequest) returns (PingResponse);
  
  // В будущем (Этап 2 и 3) здесь будут Register, Login, Sync и т.д.
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string version = 2;
}

// Инструкция по генерации:
// protoc --go_out=. --go_opt=paths=source_relative \
// --go-grpc_out=. --go-grpc_opt=paths=source_relative \
// proto/securawr.proto